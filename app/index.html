<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Frigate</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The native player draws behind the page; screens over it are transparent while playing. -->
  <object id="av-player" type="application/avplayer"></object>
  <video id="video" class="hidden" playsinline></video>

  <!-- Start -->
  <section id="screen-start" class="screen">
    <div class="center-box">
      <div class="brand"><span class="brand-dot"></span>Frigate<span class="brand-tv">TV</span></div>
      <div class="spinner"></div>
      <p id="start-status" class="muted"></p>
      <p id="start-actions" class="start-actions"></p>
    </div>
  </section>

  <!-- Home -->
  <section id="screen-home" class="screen hidden">
    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span>Frigate<span class="brand-tv">TV</span></div>
      <div class="topbar-right">
        <span id="home-status" class="muted small"></span>
        <span id="home-keys" class="keys-legend"></span>
        <span class="clock"></span>
        <div id="btn-settings" class="pill" data-i18n="home.settings"></div>
      </div>
    </header>
    <div id="home-rows" class="rows"></div>
  </section>

  <!-- Recordings of one camera -->
  <section id="screen-recordings" class="screen hidden">
    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span><span id="rec-title"></span></div>
      <div class="topbar-right"><span class="muted small" data-i18n="rec.hint"></span><span class="clock"></span></div>
    </header>
    <div id="rec-rows" class="rows"></div>
  </section>

  <!-- Settings -->
  <section id="screen-settings" class="screen hidden">
    <div class="center-box settings-box">
      <h1 data-i18n="settings.title"></h1>
      <label class="muted" for="set-url" data-i18n="settings.url"></label>
      <input id="set-url" class="field" type="url" spellcheck="false" autocomplete="off">
      <p class="muted small" data-i18n="settings.go2rtc"></p>
      <div class="muted lang-label" data-i18n="settings.language"></div>
      <div id="set-langs" class="actions langs"></div>
      <div class="muted lang-label" data-i18n="settings.live"></div>
      <div class="actions langs">
        <div id="set-mse" class="pill" data-i18n="settings.mse"></div>
        <div id="set-hls" class="pill" data-i18n="settings.hls"></div>
      </div>
      <p id="set-error" class="error"></p>
      <div class="actions">
        <div id="set-save" class="pill" data-i18n="settings.save"></div>
        <div id="set-cancel" class="pill" data-i18n="settings.back"></div>
      </div>
    </div>
  </section>

  <!-- On-screen display over the video -->
  <section id="osd" class="hidden">
    <div class="osd-top">
      <div>
        <div class="osd-title"><span id="osd-badge" class="badge"></span><span id="osd-title"></span></div>
        <div id="osd-sub" class="osd-sub"></div>
        <div id="osd-audio" class="osd-audio"></div>
      </div>
      <div class="osd-clock clock"></div>
    </div>
    <div class="osd-bottom">
      <div id="osd-progress" class="progress hidden"><div id="osd-bar" class="bar"></div></div>
      <div class="osd-times"><span id="osd-time"></span><span id="osd-dur"></span></div>
      <div id="osd-hint" class="osd-hint"></div>
    </div>
  </section>
  <!-- Camera strip over live video (OK) -->
  <div id="strip" class="strip hidden">
    <div id="strip-track" class="strip-track"></div>
    <div id="strip-hint" class="strip-hint" data-i18n="strip.hint"></div>
  </div>
  <div id="osd-state" class="osd-state hidden"></div>
  <!-- A new Frigate alert, on any screen -->
  <div id="notify" class="notify hidden">
    <img id="notify-img" alt="">
    <div class="notify-text">
      <div id="notify-title" class="notify-title"></div>
      <div id="notify-sub" class="notify-sub"></div>
      <div id="notify-hint" class="notify-hint"></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <script src="js/keys.js"></script>
  <script src="js/focus.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/frigate.js"></script>
  <script src="js/events.js"></script>
  <script src="js/mse.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
