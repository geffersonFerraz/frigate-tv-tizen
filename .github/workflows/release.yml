name: Release

# Push a tag such as v1.2.0 (or create a release with that tag in the GitHub UI) to build
# FrigateTV.wgt and attach it to the GitHub release.
# Apps2Samsung installs the .wgt from the release (and signs it on install).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: node --test tests/*.test.js

      - name: Set the app version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i -E "s|(id=\"http://frigate-tv.local/app\" version=\")[^\"]*|\1${VERSION}|" app/config.xml
          grep -q "version=\"${VERSION}\" viewmodes" app/config.xml

      - name: Build FrigateTV.wgt
        run: scripts/build.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist (created in the GitHub UI, which also pushes the tag):
          # then only attach the package to it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/FrigateTV.wgt --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/FrigateTV.wgt --title "$GITHUB_REF_NAME" --generate-notes
          fi
